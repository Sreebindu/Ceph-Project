kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    extraMounts:
      - hostPath: /run/udev
        containerPath: /run/udev
        readOnly: true
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "rook.io/node=worker-1"
  - role: worker
    extraMounts:
      - hostPath: /run/udev
        containerPath: /run/udev
        readOnly: true
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "rook.io/node=worker-2"
  - role: worker
    extraMounts:
      - hostPath: /run/udev
        containerPath: /run/udev
        readOnly: true
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "rook.io/node=worker-3"
